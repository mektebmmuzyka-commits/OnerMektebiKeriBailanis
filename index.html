<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кері байланыс — «Өнер мектебі»</title>
<link rel="icon" href="img/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ================= БАЗА ================= */
:root{
  --primary:#1e3a8a; --primary-hover:#1e40af; --primary-soft:rgba(30,58,138,.1); --accent:#d4af37;
  --bg:#f0f7ff; --surface:#ffffff; --surface-2:#e0f2fe;
  --text:#0f172a; --text-muted:#64748b; --border:#bae6fd;
  --radius:20px; --radius-sm:14px;
  --shadow-lg:0 30px 60px -15px rgba(30,58,138,.2);
  --container:900px; --header-h:84px;
}
[data-theme="dark"]{
  --primary:#3b82f6; --primary-hover:#60a5fa; --primary-soft:rgba(59,130,246,.15); --accent:#fbbf24;
  --bg:#0f172a; --surface:#1e293b; --surface-2:#334155;
  --text:#f8fafc; --text-muted:#94a3b8; --border:#475569;
  --shadow-lg:0 30px 60px -15px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;
  -webkit-font-smoothing:antialiased;
  transition:background .3s ease,color .3s ease;
  overflow-x:hidden;
}

/* ================= ФОН ================= */
body::before {
    content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background-image: url('img/background.jpeg'); background-size: cover; background-position: center; background-attachment: fixed;
    opacity: 0.2; z-index: -1; pointer-events: none; transition: opacity .3s ease, filter .3s ease;
    filter: hue-rotate(180deg);
}
[data-theme="dark"] body::before { opacity: 0.05; filter: brightness(0.2) hue-rotate(180deg); }

img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.container{width:100%;max-width:var(--container);margin-inline:auto;padding-inline:24px;}

/* ================= ХЕДЕР ================= */
.header{position:sticky;top:0;z-index:100;height:var(--header-h);background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);transition:all .3s ease;}
.header__inner{height:100%;display:flex;align-items:center;justify-content:space-between;gap:24px;}
.logo{display:flex;align-items:center;gap:16px;transition:transform .2s ease;}
.logo:hover{transform:translateY(-1px);}
.logo__img{width:56px;height:56px;object-fit:contain;border-radius:50%;flex-shrink:0;filter:drop-shadow(0 4px 8px rgba(30,58,138,0.25));}
.logo__text{display:flex;flex-direction:column;justify-content:center;}
.logo__text strong{font-size:17px;font-weight:800;color:var(--text);letter-spacing:-.02em;line-height:1.2;}
.logo__text span{font-size:12px;font-weight:600;color:var(--text-muted);line-height:1.2;margin-top:2px;}

.nav{display:flex;align-items:center;gap:8px}
.nav__link{padding:10px 20px;border-radius:12px;font-size:15px;font-weight:600;color:var(--text-muted);transition:all .2s ease;}
.nav__link:hover, .nav__link.active{color:var(--primary);background:var(--primary-soft);}

.header__actions{display:flex;align-items:center;gap:12px}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);transition:all .2s ease;}
.icon-btn:hover{color:var(--primary);border-color:var(--primary);background:var(--primary-soft);}
.icon-btn svg{width:20px;height:20px}
.burger{display:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--border);background:var(--surface);place-items:center;transition:all .2s ease;}
.burger:hover{background:var(--surface-2);}
.burger span{display:block;width:20px;height:2px;background:var(--text);border-radius:2px;transition:.3s ease}
.burger span+span{margin-top:5px}
.burger.is-open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.is-open span:nth-child(2){opacity:0}
.burger.is-open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

/* ================= ФОРМА ================= */
.feedback-section{padding:60px 0 100px;}
.feedback-card{
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:var(--radius);
  padding:40px;box-shadow:var(--shadow-lg);
  animation:fadeUp .6s ease backwards;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.feedback-header{text-align:center;margin-bottom:30px;}
.feedback-header h1{font-size:32px;font-weight:800;margin-bottom:16px;letter-spacing:-.03em;color:var(--primary);}
.feedback-header p{font-size:16px;color:var(--text-muted);max-width:600px;margin:0 auto;}

.google-form-container {
  width: 100%;
  height: 900px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  background: #fff;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}
.google-form-container iframe { width: 100%; height: 100%; border: none; display: block; }

/* ================= ФУТЕР ================= */
.footer{border-top:1px solid var(--border);padding:32px 0;background:var(--surface);}
.footer__inner{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;font-size:14px;font-weight:500;color:var(--text-muted);}

/* ================= АДАПТИВ ================= */
@media (max-width:768px){
  .container{padding-inline:20px;}
  .nav{position:fixed;top:var(--header-h);left:0;right:0;flex-direction:column;align-items:stretch;gap:8px;background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px 24px;box-shadow:0 30px 60px -15px rgba(30,58,138,.2);transform:translateY(-150%);transition:transform .3s cubic-bezier(.4,0,.2,1);visibility:hidden;}
  .nav.is-open{transform:translateY(0);visibility:visible;}
  .nav__link{padding:14px 18px;border-radius:12px;font-size:16px;}
  .burger{display:grid;}
  .feedback-card{padding:15px;}
  .feedback-header h1{font-size:26px;}
  .google-form-container { height: 1100px; }
  .logo__img{width:46px;height:46px;}
  .logo__text strong{font-size:15px;}
  .logo__text span{font-size:11px;}
}
</style>
</head>
<body>

<header class="header">
  <div class="container header__inner">
    <a href="https://mektebmmuzyka-commits.github.io/MuzMektep/" class="logo">
      <img src="img/logo.png" alt="«Өнер мектебі»" class="logo__img">
      <div class="logo__text">
        <strong>«Өнер мектебі»</strong>
        <span>мемлекеттік коммуналдық қазыналық кәсіпорны</span>
      </div>
    </a>

    <nav class="nav" id="nav">
      <a href="https://mektebmmuzyka-commits.github.io/MuzMektep/" class="nav__link">Педагогтер</a>
      <a href="#" class="nav__link active">Кері байланыс</a>
    </nav>

    <div class="header__actions">
      <button class="icon-btn" id="themeToggle" aria-label="Сменить тему">
        <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg id="iconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="burger" id="burger" aria-label="Меню" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<section class="feedback-section">
  <div class="container">
    <div class="feedback-card">
      
      <div class="feedback-header">
        <h1>Кері байланыс</h1>
        <p>Құрметті әріптестер! Бүгінгі семинардың сапасы мен тиімділігін бағалау үшін сіздердің пікірлеріңіз біз үшін өте маңызды.</p>
      </div>

      <div class="google-form-container">
        <!-- 👇 НОВАЯ ССЫЛКА НА ВАШУ ФОРМУ 👇 -->
        <iframe 
          src="https://docs.google.com/forms/d/1kOsxpfQjPdGWGYW032SwYqsdPsxAh0x1V5-a7bE9gHQ/viewform?embedded=true" 
          frameborder="0" 
          marginheight="0" 
          marginwidth="0">
          Жүктелуде…
        </iframe>
      </div>

    </div>
  </div>
</section>

<footer class="footer">
  <div class="container footer__inner">
    <span>© 2026 «Өнер мектебі» мемлекеттік коммуналдық қазыналық кәсіпорны</span>
  </div>
</footer>

<script>
/* ---------- Мобильное меню ---------- */
const burger = document.getElementById('burger');
const nav = document.getElementById('nav');
burger.addEventListener('click', () => {
  const open = nav.classList.toggle('is-open');
  burger.classList.toggle('is-open', open);
  burger.setAttribute('aria-expanded', open);
});
nav.querySelectorAll('.nav__link').forEach(link => {
  link.addEventListener('click', () => {
    nav.classList.remove('is-open');
    burger.classList.remove('is-open');
    burger.setAttribute('aria-expanded', 'false');
  });
});

/* ---------- Тема ---------- */
const themeToggle = document.getElementById('themeToggle');
const iconMoon = document.getElementById('iconMoon');
const iconSun = document.getElementById('iconSun');
function setTheme(mode){
  document.documentElement.setAttribute('data-theme', mode);
  iconMoon.style.display = mode === 'dark' ? 'none' : 'block';
  iconSun.style.display  = mode === 'dark' ? 'block' : 'none';
  localStorage.setItem('theme', mode);
}
if (localStorage.getItem('theme') === 'dark') setTheme('dark');
themeToggle.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  setTheme(cur === 'dark' ? 'light' : 'dark');
});
</script>
</body>
</html>
